[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "path2dream_ai_assistants"
version = "0.6.12"
description = "Composable Docker-based OpenCode assistant container orchestration for wrapper applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.1.0",
  "doppler-env",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"assistant_api.container_builder.container_plugin" = ["assets/*.css"]
"assistant_api.container_builder.container_plugin.command_monitor_plugin" = ["*.js"]
"assistant_api.container_builder.container_plugin.google_drive_mount_plugin" = ["assets/*.PNG"]
"assistant_api.container_builder.container_plugin.openai_provider_login_plugin" = ["assets/*.PNG"]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*", "tests/**/*"]

[tool.pytest.ini_options]
addopts = "-m 'not manual'"
markers = [
  "live_container: local Docker integration tests that are part of the default quality gate",
  "manual: live integration tests that require external credentials or human interaction",
]
pythonpath = ["src"]
testpaths = ["src"]
