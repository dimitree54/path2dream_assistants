[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-assistant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.1.0",
  "doppler-env",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assistant_api.container_builder.container_plugin" = ["assets/*.css"]
"assistant_api.container_builder.container_plugin.google_drive_mount_plugin" = ["assets/*.PNG"]
"assistant_api.container_builder.container_plugin.openai_provider_login_plugin" = ["assets/*.PNG"]

[tool.pytest.ini_options]
addopts = "-m 'not manual'"
markers = [
  "manual: live integration tests that require external credentials or human interaction",
]
pythonpath = ["src"]
testpaths = ["src"]
