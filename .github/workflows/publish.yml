name: Publish Python Package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distribution to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Run tests
        run: uv run pytest -m "not manual and not live_container"

  live-container:
    name: Live Container Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Verify Docker FUSE support
        run: |
          set -eu
          sudo modprobe fuse || true
          if [ ! -e /dev/fuse ]; then
            echo "::error::/dev/fuse is not available on this runner; live container FUSE tests cannot run."
            exit 1
          fi
          docker run --rm \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            alpine:3.23 \
            sh -lc '
              set -eu
              apk add --no-cache fuse3 rclone util-linux
              mkdir -p /tmp/rclone-source /mnt/gdrive
              printf "%s" ok > /tmp/rclone-source/probe.txt
              rclone mount /tmp/rclone-source /mnt/gdrive --daemon
              for _attempt in $(seq 1 50); do
                if mountpoint -q /mnt/gdrive; then
                  break
                fi
                sleep 0.2
              done
              mountpoint -q /mnt/gdrive
              test "$(cat /mnt/gdrive/probe.txt)" = ok
              fusermount3 -u /mnt/gdrive
            '

      - name: Run live container tests
        run: uv run pytest -m "live_container"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs:
      - test
      - live-container

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv run --with build python -m build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment:
      name: pypi
      url: https://pypi.org/project/path2dream-ai-assistants/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
